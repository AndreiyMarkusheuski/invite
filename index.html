<!DOCTYPE html>
<html lang="be">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Запрашэнне</title>
    <link rel="stylesheet" href="src/scss/main.scss">
    <link rel="icon" type="image/png" sizes="32x32" href="src/assets/images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="src/assets/images/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="src/assets/images/apple-touch-icon.png">
    <meta name="description" content="Запрашэнне на вяселле...">
    <meta property="og:locale" content="be_BY">
    <script src="src/js/local-libs/particles.min.js"></script>
    <script src="src/js/local-libs/anime.min.js"></script>
    <script data-pace-options='{"eventLag": false,"restartOnRequestAfter": false}'
        src="src/js/local-libs/pace.min.js">
    </script>
</head>
<body>
    <div class="parallax-bg"></div>
    <!-- Background image with lazy loading -->
    <img src="src/assets/images/bg.jpg" alt="Background" loading="lazy" class="background-image" style="display: none;">
    
    <!-- Audio -->
    <aside class="audio-wrapper">
        <audio class="audio-wrapper__audio__bg" id="bgSound" loop>
            <source src="src/assets/sounds/bg-sound.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>
        <audio class="audio-wrapper__audio__stars  --hidden" id="starsSound" loop>
            <source src="src/assets/sounds/stars.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>
        <button id="soundToggle" class="sound-toggle" aria-label="Toggle sound">
            <span class="sound-on">🔊</span>
            <span class="sound-off hidden">🔇</span>
        </button>
    </aside>

    <!-- Loader -->
    <div id="loader" class="loader">
        <div class="loader-blocks">
            <!-- 10 blocks for loading animation -->
            <div class="block"></div>
            <div class="block"></div>
            <div class="block"></div>
            <div class="block"></div>
            <div class="block"></div>
            <div class="block"></div>
            <div class="block"></div>
            <div class="block"></div>
            <div class="block"></div>
            <div class="block"></div>
        </div>
        <div class="loader-text">Чароўная загрузка...</div>
    </div>

    <!-- Rest of content (initially hidden) -->
    <div id="mainWrapper" class="hidden">
        <div class="stars" id="flyingStars"></div>

        <div class="flower" id="flowerButton">
        </div>

        <!-- Main Message Display -->
        <div id="message" class="message hidden"></div>

        <!-- Modal -->
        <div id="modal" class="modal">
            <div id="modalButton" class="modal-content">
                <p id="detect-os" class="modal-content-text --first">Вы гатовыя працягваць?</p>
                <p id="detect-os" class="modal-content-text --second">Націсніце</p>
            </div>
        </div>
    </div>
    
    <!-- Add particles.js library -->
    <script type="module" src="src/js/main.js"></script>
</body>
</html>
